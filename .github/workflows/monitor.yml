name: Website Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: website-monitor
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: pip install requests beautifulsoup4

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          TELEGRAM_CHAT_ID: "${{ secrets.TELEGRAM_CHAT_ID }}"
        run: python monitor.py
        
      - name: Save state
        run: |
          git config user.name "Website Monitor"
          git config user.email "website-monitor@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update monitoring state"
          git pull --rebase origin main
          git push
