name: Website Monitor

on:
schedule:
- cron: "*/5 * * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
monitor:
runs-on: ubuntu-latest

steps:
- name: Get repository
uses: actions/checkout@v4

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Install dependencies
run: |
pip install requests beautifulsoup4

- name: Run monitor
env:
TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
run: python monitor.py

- name: Save monitoring state
run: |
git config user.name "Website Monitor"
git config user.email "website-monitor@users.noreply.github.com"
git add state.json
git diff --cached --quiet || git commit -m "Update monitoring state"
git push
