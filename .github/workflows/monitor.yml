name: Website Monitor

on: [workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Telegram test
        env:
          TELEGRAM_BOT_TOKEN: $
{{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: $
{{ secrets.TELEGRAM_CHAT_ID }}
        run: python 
telegram_test.py
