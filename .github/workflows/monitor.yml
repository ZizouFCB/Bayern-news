name: Website Monitor

on:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-latest
steps:
- name: Telegram test
env:
BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
run: curl -s -X POST "api.telegram.org/bot$BOT_TOKEN/sendMessage" -d "chat_id=$CHAT_ID" -d "text=GitHub Telegram test successful!"
